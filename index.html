<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">

<body style="background-color: black;color: white; padding: 20px;min-height: 100vh; display: flex;justify-content: center;align-items: center;">
<div class="game-container">
    <header class="dashboard"
      style="  background-color: #d65454;  padding: 20px;  border-radius: 12px;  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);text-align: center;">
        <h1 style="
        font-size: 1.8rem; margin-bottom: 12px; color: black;">Flip Flop Game</h1>
        <div class="stat">Moves: 
            <span id="moves-count" style="color: rgb(64, 40, 40);">0</span>
        </div>
        <div class="stat">Timer: 
            <span id="timer" style="color: rgb(64, 40, 40);">00:00</span>
        </div>
        <div class="stat">Matches: 
            <span id="matches-count" style="color: rgb(64, 40, 40);">0</span> / 8
        </div>
    </header>
    <button id="restart-btn" class="btn" style="background-color: rgb(193, 167, 167); color: white;border: none;padding: 10px 20px;border-radius: 6px;font-size: 1rem;font-weight: 600;cursor: pointer;transition: background-color 0.2s ease, transform 0.1s ease;">Restart Game</button>
</div>
